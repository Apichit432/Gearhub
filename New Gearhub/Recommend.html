<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รีวิว — GEARHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#eef1f6;
    --ink:#0f1729;
    --ink-muted:#667085;
    --line:#e7eaf1;
    --card-bg:#ffffff;
    --card-shadow: 0 2px 10px rgba(16,24,57,0.06);
    --card-shadow-hover: 0 14px 30px rgba(16,24,57,0.12);
    --blue:#2f5ce8;
    --blue-dark:#1c3fb3;
    --purple:#8b5cf6;
    --radius:16px;
    --maxw:1240px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img,svg{ display:block; }

  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }

  /* ===== Header (matches site — white) ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; height:78px; }
  .logo{ font-weight:700; font-size:21px; letter-spacing:0.3px; color:var(--ink); }
  .logo span.hub{ color:var(--blue); }

  nav.main-nav{ display:flex; gap:36px; }
  nav.main-nav a{
    font-size:15px; font-weight:400; color:var(--ink);
    position:relative; padding:8px 2px;
  }
  nav.main-nav a.active{ color:var(--blue); font-weight:500; }
  nav.main-nav a::after{
    content:''; position:absolute; left:0; bottom:0; width:0%; height:2px;
    background:var(--blue); transition:width .2s ease;
  }
  nav.main-nav a:hover::after, nav.main-nav a.active::after{ width:100%; }

  .header-right{ display:flex; align-items:center; gap:20px; }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--blue); border-radius:10px;
    padding:11px 16px; width:280px;
    box-shadow:0 0 0 3px rgba(47,92,232,0.08);
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:inherit; font-size:14px; color:var(--ink); width:100%;
  }
  .search-box input::placeholder{ color:#a7adba; }
  .search-box svg{ flex-shrink:0; color:#a7adba; }
  .login-btn{ display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:500; color:var(--ink); }
  .login-btn .avatar{
    width:32px; height:32px; border-radius:50%;
    background:var(--blue-dark);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }

  /* ===== Page content ===== */
  .section{ padding:30px 0 70px; }

  .badge{
    display:inline-block;
    background:var(--blue);
    color:#fff;
    font-size:12.5px;
    font-weight:500;
    padding:6px 16px;
    border-radius:8px;
    margin-bottom:20px;
  }

  .review-list{ display:flex; flex-direction:column; gap:18px; }

  .review-card{
    display:flex;
    align-items:center;
    gap:26px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 26px;
    box-shadow:var(--card-shadow);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    color:inherit;
    text-decoration:none;
  }
  .review-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--card-shadow-hover);
    color:inherit;
  }
  .review-card-img{
    flex-shrink:0;
    width:150px; height:110px;
    display:flex; align-items:center; justify-content:center;
  }
  .review-card-img img{ width:100%; height:100%; object-fit:contain; }

  .review-card-body{ flex:1; min-width:0; }
  .review-card-body h3{
    font-size:15px; font-weight:600; color:var(--ink); margin-bottom:8px;
  }
  .review-card-body .quote{
    font-size:12.5px; color:var(--ink-muted); line-height:1.7; margin-bottom:6px;
  }
  .review-card-body .meta{
    font-size:12px; color:var(--ink-muted); line-height:1.7;
  }
  .review-card-body .meta b{ color:var(--ink); font-weight:500; }

  /* ===== Footer ===== */
  footer{ background:#f7f9fd; border-top:1px solid var(--line); padding:44px 0 22px; }
  .footer-bottom{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px; color:var(--ink-muted);
  }

  /* ===== Responsive ===== */
  @media (max-width:980px){
    nav.main-nav{ display:none; }
    .search-box{ width:190px; }
  }
  @media (max-width:640px){
    .wrap{ padding:0 18px; }
    .search-box{ display:none; }
    .review-card{ flex-direction:column; text-align:center; }
    .review-card-img{ width:120px; height:100px; }
  }
</style>
