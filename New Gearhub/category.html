<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หมวดหมู่ — GEARHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#eef1f6;
    --ink:#0f1729;
    --ink-muted:#667085;
    --line:#e7eaf1;
    --card-bg:#ffffff;
    --card-shadow: 0 2px 10px rgba(16,24,57,0.06);
    --card-shadow-hover: 0 14px 30px rgba(16,24,57,0.12);
    --blue:#2f5ce8;
    --blue-dark:#1c3fb3;
    --radius:16px;
    --maxw:1240px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img,svg{ display:block; }

  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }

  /* ===== Header (light, matches site) ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; height:78px; }
  .logo{ font-weight:700; font-size:21px; letter-spacing:0.3px; color:var(--ink); }
  .logo span.hub{ color:var(--blue); }

  nav.main-nav{ display:flex; gap:36px; }
  nav.main-nav a{
    font-size:15px; font-weight:400; color:var(--ink);
    position:relative; padding:8px 2px;
  }
  nav.main-nav a::after{
    content:''; position:absolute; left:0; bottom:0; width:0%; height:2px;
    background:var(--blue); transition:width .2s ease;
  }
  nav.main-nav a:hover::after{ width:100%; }
  nav.main-nav a.active{ color:var(--blue); font-weight:500; }
  nav.main-nav a.active::after{ width:100%; }

  .header-right{ display:flex; align-items:center; gap:20px; }

  .search-box{
    display:flex; align-items:center; gap:10px;
    background:#fff;
    border:1.5px solid var(--blue);
    border-radius:10px;
    padding:11px 16px;
    width:300px;
    box-shadow:0 0 0 3px rgba(47,92,232,0.08);
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:inherit; font-size:14px; color:var(--ink); width:100%;
  }
  .search-box input::placeholder{ color:#a7adba; }
  .search-box svg{ flex-shrink:0; color:#a7adba; }

  .login-btn{
    display:flex; align-items:center; gap:8px;
    font-size:14.5px; font-weight:500; color:var(--ink);
  }

  /* ===== Page body ===== */
  .section{ padding:32px 0 80px; }

  .cat-badge{
    display:inline-flex; align-items:center;
    font-size:14px; font-weight:500; color:#fff;
    background:var(--blue);
    padding:10px 22px; border-radius:10px;
    margin-bottom:28px;
    box-shadow:0 6px 16px rgba(47,92,232,0.25);
  }

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:22px;
    max-width:900px;
  }
  .cat-card{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--card-shadow);
    padding:26px 14px;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .cat-card:hover{
    transform:translateY(-5px);
    box-shadow:var(--card-shadow-hover);
    border-color:#bcc8f5;
  }
  .cat-icon{
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .cat-card h3{ font-size:14.5px; font-weight:600; color:var(--ink); }

  /* ===== Responsive ===== */
  @media (max-width:980px){
    nav.main-nav{ display:none; }
    .search-box{ width:190px; }
    .cat-grid{ grid-template-columns:repeat(2,1fr); max-width:none; }
  }
  @media (max-width:560px){
    .wrap{ padding:0 18px; }
    .search-box{ display:none; }
    .cat-grid{ grid-template-columns:1fr 1fr; gap:14px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="Mainsite.html" class="logo">GEAR<span class="hub">HUB</span></a>
    <nav class="main-nav">
      <a href="Mainsite.html">หน้าแรก</a>
      <a href="All Equipment.html">อุปกรณ์</a>
      <a href="Recommend.html">รีวิว</a>
      <a href="category.html" class="active">หมวดหมู่</a>
    </nav>
    <div class="header-right">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="ค้นหาสินค้า...">
      </div>
      <a href="Login.html" class="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        เข้าสู่ระบบ
      </a>
    </div>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <span class="cat-badge">Category</span>

    <div class="cat-grid">

      <a class="cat-card" href="MousePage.html">
        <div class="cat-icon">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 3c-3 0-5.5 2.3-5.5 6v6c0 3.3 2.5 6 5.5 6s5.5-2.7 5.5-6V9c0-3.7-2.5-6-5.5-6z"/>
            <line x1="12" y1="3" x2="12" y2="10"/>
          </svg>
        </div>
        <h3>Mouse</h3>
      </a>

      <a class="cat-card" href="KeyboardPage.html">
        <div class="cat-icon">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="6" width="19" height="12" rx="2"/>
            <line x1="5.5" y1="9.5" x2="5.5" y2="9.5"/>
            <line x1="8.5" y1="9.5" x2="8.5" y2="9.5"/>
            <line x1="11.5" y1="9.5" x2="11.5" y2="9.5"/>
            <line x1="14.5" y1="9.5" x2="14.5" y2="9.5"/>
            <line x1="17.5" y1="9.5" x2="17.5" y2="9.5"/>
            <line x1="5.5" y1="12.5" x2="5.5" y2="12.5"/>
            <line x1="8.5" y1="12.5" x2="8.5" y2="12.5"/>
            <line x1="11.5" y1="12.5" x2="11.5" y2="12.5"/>
            <line x1="14.5" y1="12.5" x2="14.5" y2="12.5"/>
            <line x1="17.5" y1="12.5" x2="17.5" y2="12.5"/>
            <line x1="7" y1="15.5" x2="17" y2="15.5"/>
          </svg>
        </div>
        <h3>Keyboard</h3>
      </a>

      <a class="cat-card" href="HeadphonePage.html">
        <div class="cat-icon">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 13a9 9 0 0 1 18 0"/>
            <path d="M21 13v5a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2z" transform="translate(0,0)"/>
            <rect x="17" y="13" width="4" height="7" rx="1.5"/>
            <rect x="3" y="13" width="4" height="7" rx="1.5"/>
          </svg>
        </div>
        <h3>Headphone</h3>
      </a>

      <a class="cat-card" href="Monitorpage.html">
        <div class="cat-icon">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="4" width="19" height="13" rx="1.5"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <h3>Monitor</h3>
      </a>

    </div>
  </div>
</section>

<script src="auth-nav.js"></script>
</body>
</html>
