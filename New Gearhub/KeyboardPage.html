<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คีย์บอร์ด — GEARHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#eef1f6;
    --ink:#0f1729;
    --ink-muted:#667085;
    --line:#e7eaf1;
    --card-bg:#ffffff;
    --card-shadow: 0 2px 10px rgba(16,24,57,0.06);
    --card-shadow-hover: 0 14px 30px rgba(16,24,57,0.12);
    --blue:#2f5ce8;
    --blue-dark:#1c3fb3;
    --radius:16px;
    --maxw:1240px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; height:100%; }
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img,svg{ display:block; }

  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }

  /* ===== Header (matches site) ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; height:78px; }
  .logo{ font-weight:700; font-size:21px; letter-spacing:0.3px; color:var(--ink); }
  .logo span.hub{ color:var(--blue); }

  nav.main-nav{ display:flex; gap:36px; }
  nav.main-nav a{
    font-size:15px; font-weight:400; color:var(--ink);
    position:relative; padding:8px 2px;
  }
  nav.main-nav a.active{ color:var(--blue); font-weight:500; }
  nav.main-nav a::after{
    content:''; position:absolute; left:0; bottom:0; width:0%; height:2px;
    background:var(--blue); transition:width .2s ease;
  }
  nav.main-nav a:hover::after, nav.main-nav a.active::after{ width:100%; }

  .header-right{ display:flex; align-items:center; gap:20px; }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--blue); border-radius:10px;
    padding:11px 16px; width:280px;
    box-shadow:0 0 0 3px rgba(47,92,232,0.08);
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:inherit; font-size:14px; color:var(--ink); width:100%;
  }
  .search-box input::placeholder{ color:#a7adba; }
  .search-box svg{ flex-shrink:0; color:#a7adba; }
  .login-btn{ display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:500; color:var(--ink); }

  /* ===== Page header ===== */
  .page-title-bar{ padding:34px 0 26px; text-align:center; }
  .page-title-bar h1{ font-size:20px; font-weight:600; color:var(--ink); }
  .breadcrumb{
    display:flex; justify-content:center; gap:8px;
    font-size:12.5px; color:var(--ink-muted); margin-top:8px;
  }
  .breadcrumb a:hover{ color:var(--blue); }

  /* ===== Filter bar ===== */
  .filter-bar{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px;
    margin-bottom:26px;
  }
  .result-count{ font-size:13px; color:var(--ink-muted); }

  /* ===== Product grid ===== */
  .section{ flex:1; padding-bottom:70px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:22px;
  }
  .p-card{
    display:block;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 18px 20px;
    box-shadow:var(--card-shadow);
    text-align:center;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    cursor:pointer;
  }
  .p-card:hover{
    transform:translateY(-5px);
    box-shadow:var(--card-shadow-hover);
    border-color:#d6ddf5;
  }
  .p-card-img{
    height:150px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
  }
  .p-card-img svg{ width:78%; height:78%; }
  .p-card-img img{ width:100%; height:100%; object-fit:contain; }
  .p-card h3{ font-size:14.5px; font-weight:500; color:var(--ink); margin-bottom:6px; }
  .p-card .p-price{ font-size:14px; font-weight:600; color:var(--blue); }
  .p-card .p-price .thb{ font-size:11px; color:var(--ink-muted); font-weight:400; margin-right:2px; }

  /* ===== Pagination ===== */
  .pagination{ display:flex; justify-content:center; gap:8px; margin-top:44px; }
  .pagination a{
    width:38px; height:38px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--ink-muted);
    background:#fff; border:1px solid var(--line);
    transition:.2s ease;
  }
  .pagination a.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .pagination a:hover:not(.active){ border-color:var(--blue); color:var(--blue); }

  /* ===== Footer ===== */
  footer{ background:#f7f9fd; border-top:1px solid var(--line); padding:44px 0 22px; }
  .footer-bottom{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px; color:var(--ink-muted);
  }

  /* ===== Responsive ===== */
  @media (max-width:980px){
    nav.main-nav{ display:none; }
    .search-box{ width:190px; }
    .grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px){
    .wrap{ padding:0 18px; }
    .grid{ grid-template-columns:1fr; }
    .search-box{ display:none; }
    .filter-bar{ justify-content:center; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="Mainsite.html" class="logo">GEAR<span class="hub">HUB</span></a>
    <nav class="main-nav">
      <a href="Mainsite.html">หน้าแรก</a>
      <a href="All Equipment.html">อุปกรณ์</a>
      <a href="Recommend.html">รีวิว</a>
      <a href="category.html" class="active">หมวดหมู่</a>
    </nav>
    <div class="header-right">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="ค้นหาสินค้า...">
      </div>
      <a href="Login.html" class="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        เข้าสู่ระบบ
      </a>
    </div>
  </div>
</header>

<div class="page-title-bar">
  <h1>คีย์บอร์ด</h1>
  <div class="breadcrumb">
    <a href="Mainsite.html">หน้าแรก</a> / <a href="category.html">หมวดหมู่</a> / <a href="KeyboardPage.html">คีย์บอร์ด</a>
  </div>
</div>

<section class="section">
  <div class="wrap">

    <div class="filter-bar">
      <div class="result-count">พบ 16 รายการ</div>
    </div>

    <div class="grid" id="product-grid"></div>

    <div class="pagination">
      <a href="#" class="active">1</a>
    </div>

  </div>
</section>

<footer>
  <div class="wrap footer-bottom">
    <span>© 2026 GEARHUB. สงวนลิขสิทธิ์ทุกประการ</span>
    <span>ออกแบบเพื่อเกมเมอร์ 🎮</span>
  </div>
</footer>

<script>
  // mouse icon SVG markup, reused for every placeholder card
  const mouseSVG = `
    <svg viewBox="0 0 160 180" fill="none">
      <path d="M50 42 Q80 22 110 42 Q124 55 124 90 L124 130 Q124 160 80 168 Q36 160 36 130 L36 90 Q36 55 50 42 Z" fill="#f4f6fb" stroke="#c1cae8" stroke-width="2"/>
      <path d="M50 42 Q80 22 110 42 Q120 50 123 62 L37 62 Q40 50 50 42 Z" fill="#171b24"/>
      <line x1="80" y1="62" x2="80" y2="95" stroke="#c1cae8" stroke-width="2"/>
      <circle cx="80" cy="78" r="7" fill="#2f5ce8" opacity="0.85"/>
    </svg>
  `;

  /* ============================================================
     ✏️ ใส่ข้อมูลอุปกรณ์ตรงนี้ (แก้ไข/เพิ่ม/ลบรายการได้อิสระ)
     ------------------------------------------------------------
     name  = ชื่ออุปกรณ์
     price = ราคา (ตัวเลขล้วน ไม่ต้องมีคอมมา)
     image = พาธไฟล์รูปสินค้า เช่น "products/mouse-1.png"
             ถ้ายังไม่มีรูป ให้ใส่ "" (ว่าง) ระบบจะใช้ไอคอนเมาส์ตัวอย่างแทน
     link  = ไฟล์หน้ารายละเอียดสินค้าของชิ้นนี้ เช่น "product-x2.html"
             ต้องสร้างไฟล์ html แยกสำหรับสินค้าแต่ละชิ้น แล้วใส่ชื่อไฟล์ตรงนี้
     ============================================================ */
  const products = [
    { name: "Wooting 60 He+",                    price: 5207,  image: "Product/Product_Wooting60.png", link: "wooting 60He+.html" },
    { name: "ATK EDGE 60 HE",                    price: 3494,  image: "Product/Product_ATKedge60.png", link: "EDGE 60 HE.html" },
    { name: "AULA F75",                    price: 1890,  image: "Product/Product_aulaf75.png", link: "AULAF75.html" },
    { name: "RAZER HUNTSMAN V3 PRO",                    price: 7490,  image: "Product/Product_huntman.png", link: "RAZERHUNTMAN.html" },
  ];
  /* ============================================================
     จบส่วนข้อมูลอุปกรณ์ — โค้ดด้านล่างไม่ต้องแก้
     ============================================================ */

  const grid = document.getElementById('product-grid');
  grid.innerHTML = products.map(p => `
    <a class="p-card" href="${p.link}">
      <div class="p-card-img">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : mouseSVG}
      </div>
      <h3>${p.name}</h3>
      <div class="p-price"><span class="thb">฿</span>${p.price.toLocaleString('th-TH')}</div>
    </a>
  `).join('');
</script>

</body>
</html>
