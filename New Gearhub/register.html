<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก — GEARHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#ffffff;
    --ink:#0f1729;
    --ink-muted:#667085;
    --line:#e7eaf1;
    --card-bg:#ffffff;
    --card-shadow: 0 2px 10px rgba(16,24,57,0.06);
    --blue:#2f5ce8;
    --blue-dark:#1c3fb3;
    --cyan:#3ee3ff;
    --navy:#0a1330;
    --navy-2:#101d47;
    --error:#e5484d;
    --radius:16px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }

  /* ===== Page shell: centered layout ===== */
  .auth-shell{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(62,227,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(47,92,232,0.35), transparent 50%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 60%, #0c1638 100%);
  }
  .auth-shell::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 40%, rgba(0,0,0,0.9), transparent 75%);
    pointer-events:none;
  }

  .brand-top{
    position:relative; z-index:2;
    margin-bottom:28px;
  }
  .brand-logo{
    font-weight:700; font-size:24px; letter-spacing:0.3px; color:#fff;
  }
  .brand-logo span.hub{ color:var(--cyan); }

  .brand-bottom{
    position:relative; z-index:2;
    font-size:12px; color:#616c94;
    margin-top:28px;
  }

  /* ===== Form card ===== */
  .form-panel{
    position:relative; z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .auth-card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:20px;
    padding:36px 32px;
    box-shadow:0 24px 60px rgba(4,8,26,0.45);
  }

  .panel-heading{ margin-bottom:26px; }
  .panel-heading h2{
    font-size:22px; font-weight:600; color:var(--ink);
    margin-bottom:6px;
  }
  .panel-heading p{
    font-size:13.5px; color:var(--ink-muted);
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:400;
    color:var(--ink);
    margin-bottom:7px;
  }
  .input-wrap{
    display:flex; align-items:center; gap:10px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    transition:border-color .2s ease, box-shadow .2s ease;
    background:#fff;
  }
  .input-wrap:focus-within{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(47,92,232,0.1);
  }
  .input-wrap svg{ flex-shrink:0; color:#a7adba; }
  .input-wrap input{
    border:none; outline:none; background:transparent;
    font-size:14px; color:var(--ink); width:100%;
  }
  .input-wrap input::placeholder{ color:#a7adba; }
  .toggle-visibility{
    background:none; border:none; color:#a7adba; flex-shrink:0;
    display:flex; align-items:center;
  }
  .toggle-visibility:hover{ color:var(--ink-muted); }

  .field-error{
    display:none;
    font-size:12px;
    color:var(--error);
    margin-top:6px;
  }
  .field.has-error .input-wrap{
    border-color:var(--error);
  }
  .field.has-error .field-error{ display:block; }

  .btn-submit{
    width:100%;
    background:var(--blue);
    color:#fff;
    font-size:15px; font-weight:500;
    padding:14px 0;
    border-radius:10px;
    box-shadow:0 10px 24px rgba(47,92,232,0.35);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    border:none;
  }
  .btn-submit:hover{
    transform:translateY(-2px);
    background:var(--blue-dark);
    box-shadow:0 14px 28px rgba(47,92,232,0.45);
  }
  .btn-submit:active{ transform:translateY(0); }

  .switch-note{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-muted);
    margin-top:24px;
  }
  .switch-note .switch-link{
    color:var(--blue); font-weight:500; font-size:13.5px;
  }
  .switch-note .switch-link:hover{ text-decoration:underline; }

  .terms-row{
    display:flex; align-items:flex-start; gap:9px;
    margin-bottom:24px;
    font-size:12.5px;
    color:var(--ink-muted);
    line-height:1.6;
  }
  .terms-row input[type="checkbox"]{
    width:16px; height:16px; accent-color:var(--blue); cursor:pointer;
    margin-top:2px; flex-shrink:0;
  }
  .terms-row a{ color:var(--blue); }
  .terms-row a:hover{ text-decoration:underline; }

  /* ===== Responsive ===== */
  @media (max-width:480px){
    .auth-card{ padding:28px 20px; border-radius:16px; }
  }
</style>
</head>
<body>

<div class="auth-shell">

  <div class="brand-top">
    <a href="Mainsite.html" class="brand-logo">GEAR<span class="hub">HUB</span></a>
  </div>

  <div class="form-panel">
    <div class="auth-card">

      <div class="panel-heading">
        <h2>สมัครสมาชิก</h2>
        <p>สร้างบัญชีใหม่เพื่อเริ่มช้อปกับ GEARHUB</p>
      </div>

      <form onsubmit="event.preventDefault();">
        <div class="field" id="signupNameField">
          <label for="signupName">ชื่อ-นามสกุล</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="signupName" placeholder="ชื่อ-นามสกุล" required>
          </div>
          <div class="field-error">กรุณากรอกชื่อ-นามสกุล</div>
        </div>

        <div class="field" id="signupEmailField">
          <label for="signupEmail">อีเมล</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6l-10 7L2 6"/><path d="M2 6h20v12H2z"/></svg>
            <input type="email" id="signupEmail" placeholder="อีเมล" required>
          </div>
          <div class="field-error">กรุณากรอกอีเมลให้ถูกต้อง</div>
        </div>

        <div class="field" id="signupPassField">
          <label for="signupPass">รหัสผ่าน</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="signupPass" placeholder="รหัสผ่าน" required>
            <button type="button" class="toggle-visibility" onclick="toggleVisibility('signupPass', this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-error">รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร</div>
        </div>

        <div class="field" id="signupPass2Field">
          <label for="signupPass2">ยืนยันรหัสผ่าน</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="signupPass2" placeholder="ยืนยันรหัสผ่าน" required>
            <button type="button" class="toggle-visibility" onclick="toggleVisibility('signupPass2', this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-error">รหัสผ่านไม่ตรงกัน</div>
        </div>

        <button type="submit" class="btn-submit" id="signupSubmit">สมัครสมาชิก</button>
      </form>

      <div class="field-error" id="formError" style="display:none; text-align:center; margin-bottom:16px;"></div>

      <div class="switch-note">
        มีบัญชีอยู่แล้ว? <a href="Login.html" class="switch-link">เข้าสู่ระบบ</a>
      </div>

    </div>
  </div>

  <div class="brand-bottom">© 2026 GEARHUB. สงวนลิขสิทธิ์ทุกประการ</div>

</div>

<script>
  function toggleVisibility(inputId, btn){
    const input = document.getElementById(inputId);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  document.querySelector('form').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('signupName');
    const email = document.getElementById('signupEmail');
    const pass = document.getElementById('signupPass');
    const pass2 = document.getElementById('signupPass2');
    const errorBox = document.getElementById('formError');
    errorBox.style.display = 'none';

    const nameInvalid = name.value.trim() === '';
    const emailInvalid = !email.value.includes('@');
    const passInvalid = pass.value.length < 8;
    const pass2Invalid = pass2.value !== pass.value || pass2.value === '';

    document.getElementById('signupNameField').classList.toggle('has-error', nameInvalid);
    document.getElementById('signupEmailField').classList.toggle('has-error', emailInvalid);
    document.getElementById('signupPassField').classList.toggle('has-error', passInvalid);
    document.getElementById('signupPass2Field').classList.toggle('has-error', pass2Invalid);
    if (nameInvalid || emailInvalid || passInvalid || pass2Invalid) return;

    const submitBtn = document.getElementById('signupSubmit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังสมัครสมาชิก...';

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name: name.value.trim(), email: email.value.trim(), password: pass.value })
      });
      const data = await res.json();

      if (!res.ok) {
        errorBox.textContent = data.error || 'สมัครสมาชิกไม่สำเร็จ';
        errorBox.style.display = 'block';
        return;
      }

      window.location.href = 'Mainsite.html';
    } catch (err) {
      errorBox.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'สมัครสมาชิก';
    }
  });
</script>

</body>
</html>
